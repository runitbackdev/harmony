[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", branch = "main", features = [
  "js",
  "unstable-msc4274",
  "native-tls",
] }
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", branch = "main", default-features = false, features = [
  "indexeddb",
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "js",
  "unstable-msc4274",
  "native-tls",
] }

tsify-next = "0.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

js-sys = "0.3"
thiserror = "2"

tracing = { version = "0.1", features = ["release_max_level_off"] }
tracing-wasm = "0.2"

futures-util = "0.3"
wasm-streams = "0.4"
web-sys = { version = "0.3", features = ["ReadableStream"] }
