[package]
name = "harmony-protocol"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
harmony-protocol-macros = { path = "../harmony-protocol-macros" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "2"
tsify = "0.5"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["ReadableStream"] }
js-sys = "0.3"
