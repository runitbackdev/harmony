packages:
  - apps/*
  - packages/*

allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true

catalog:
  "@floating-ui/react": ^0.27.20
  "@tanstack/react-hotkeys": ^0.10.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  lucide-react: ^1.33.0
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.8
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.24
  vite-plus: ^0.2.9
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
