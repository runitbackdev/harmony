packages:
  - apps/*
  - packages/*

catalog:
  "@tanstack/react-hotkeys": ^0.4.1
  "@types/react": ^19.2.7
  "@types/react-dom": ^19.2.3
  react: ^19.2.0
  react-dom: ^19.2.0
  typescript: ~5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
