pre-commit:
  parallel: true
  jobs:
    - name: cargo-fmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true

    - name: prettier
      glob: "*.{ts,tsx}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    - name: clippy
      glob: "*.rs"
      run: cargo clippy --workspace -- -D warnings

    - name: lint
      glob: "*.{ts,tsx}"
      run: pnpm lint

    - name: typos
      run: typos {staged_files}

commit-msg:
  jobs:
    - name: committed
      run: committed --config .committed.toml --commit-file {1}
output:
  - progress
  - summary
  - failure
