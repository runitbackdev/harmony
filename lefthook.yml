pre-commit:
  parallel: true
  jobs:
    - name: cargo-fmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true

    - name: format
      glob: "*.{ts,tsx}"
      run: vp check --fix --no-lint {staged_files}
      stage_fixed: true

    - name: clippy
      glob: "*.rs"
      run: cargo clippy --workspace -- -D warnings

    - name: lint
      glob: "*.{ts,tsx}"
      run: vp lint --deny-warnings

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: vp check --no-fmt

    - name: typos
      exclude: "*.woff2"
      run: typos {staged_files}

commit-msg:
  jobs:
    - name: committed
      run: committed --config .committed.toml --commit-file {1}
output:
  - progress
  - summary
  - failure
