services:
  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    container_name: harmony-synapse
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      UID: "0"
      GID: "0"
    volumes:
      - ./synapse/homeserver.yaml:/config/homeserver.yaml:ro,z
      - ./synapse/log.config:/config/log.config:ro,z
      - ./synapse/herald.registration.yaml:/config/herald.registration.yaml:ro,z
      - synapse-data:/data:z
    ports:
      - "8008:8008"

  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: harmony-postgres
    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: herald
      POSTGRES_DB: herald
    volumes:
      - postgres-data:/var/lib/postgresql/data:z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herald -d herald"]
      interval: 5s
      timeout: 5s
      retries: 10

  herald:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harmony-herald
    environment:
      HERALD_DATABASE_URL: postgres://herald:herald@postgres:5432/herald
      HERALD_HOMESERVER_URL: http://synapse:8008
      HERALD_HS_TOKEN: herald-dev-hs-token
      HERALD_AS_TOKEN: herald-dev-as-token
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  synapse-data:
  postgres-data:
