[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
enum-glob-use = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
result_large_err = "allow"
