[workspace]
resolver = "3"
members = [
  "apps/desktop",
  "packages/harmony-protocol",
  "packages/harmony-protocol-macros",
  "tools/harmony-cli",
]

[workspace.dependencies]
harmony-protocol = { path = "packages/harmony-protocol" }
harmony-protocol-macros = { path = "packages/harmony-protocol-macros" }

matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "e5cf097e32e30326d18091254bfcfa447c6de615", default-features = false }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "e5cf097e32e30326d18091254bfcfa447c6de615" }
matrix-sdk-common = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "e5cf097e32e30326d18091254bfcfa447c6de615" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
specta-typescript = "=0.0.11"
inventory = "0.3"
tauri = "2"
tokio = "1"
tracing = "0.1"
uniffi = "0.31"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
enum-glob-use = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
result_large_err = "allow"
cast_possible_truncation = "allow"
