[package]
name = "herald"
version = "0.1.0"
edition = "2021"
default-run = "herald"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
toasty = { version = "0.6", features = ["postgresql", "jiff"] }
toasty-cli = "0.6"
jiff = { version = "0.2", features = ["serde"] }
ruma = { version = "0.15", features = ["client-api-c", "appservice-api-c"] }
http = "1"
figment = { version = "0.10", features = ["env", "toml"] }
nanoid = "0.5"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
url = { version = "2", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
futures-util = "0.3"
dashmap = "6"
parking_lot = "0.12"
moka = { version = "0.12", features = ["future"] }
thiserror = "2"
anyhow = "1"
subtle = "2"
tower_governor = "0.8"
governor = "0.10"
tokio-util = "0.7.18"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
wiremock = "0.6"
