name: PR

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Check (lint, types, clippy, codegen drift, typos)
        run: just check

      - name: Build
        run: just build
