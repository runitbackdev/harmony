[package]
name = "harmony-bindings-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
harmony-protocol = { path = "../../harmony-protocol", features = ["web"] }
tracing = { version = "0.1", features = ["release_max_level_off"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
