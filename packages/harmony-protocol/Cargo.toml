[package]
name = "harmony-protocol"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = []
web = [
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:serde-wasm-bindgen",
  "dep:web-sys",
  "dep:js-sys",
  "dep:wasm-streams",
  "dep:getrandom",
  "dep:uuid",
]
desktop = ["dep:tauri", "dep:dashmap", "dep:tokio"]
mobile = ["dep:uniffi"]

[dependencies]
harmony-protocol-macros = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = "0.11"
thiserror = "2"
specta = { workspace = true }
specta-macros = { version = "=2.0.0-rc.24", features = ["serde"] }
specta-typescript = { workspace = true }
inventory = { workspace = true }
tracing = { workspace = true, features = ["release_max_level_off"] }
futures-channel = "0.3"
futures-util = "0.3"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
mime = "0.3"
matrix-sdk-common = { workspace = true }

# Web (wasm32) binding deps — pulled in via `feature = "web"`.
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
web-sys = { version = "0.3", features = ["ReadableStream"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-streams = { version = "0.4", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
uuid = { version = "1", features = ["js"], optional = true }

# Desktop binding deps — pulled in via `feature = "desktop"`.
tauri = { workspace = true, optional = true }
dashmap = { version = "6", optional = true }
tokio = { workspace = true, features = ["rt", "macros"], optional = true }

# Mobile binding deps — pulled in via `feature = "mobile"`.
uniffi = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
matrix-sdk-ui = { workspace = true, features = ["js", "unstable-msc4274"] }
matrix-sdk = { workspace = true, features = [
  "indexeddb",
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "js",
  "unstable-msc4274",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
matrix-sdk-ui = { workspace = true, features = ["unstable-msc4274"] }
matrix-sdk = { workspace = true, features = [
  "bundled-sqlite",
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "unstable-msc4274",
] }
dirs = "6"
